<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Photo Tournament</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📷 Photo Tournament</h1>
    <p class="tagline">Pick your favourites head-to-head. Get a full ranking.</p>
  </header>

  <main>
    <!-- ───────────── Upload screen ───────────── -->
    <section id="upload" class="screen active">
      <label id="dropzone" for="file-input">
        <div class="dropzone-inner">
          <span class="dz-icon">⬆️</span>
          <span class="dz-title">Tap to add photos</span>
          <span class="dz-sub">or drag &amp; drop — up to 256</span>
        </div>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
      </label>

      <div id="thumbs" class="thumbs"></div>

      <div id="setup" class="setup" hidden>
        <p class="setup-label">How thorough should the ranking be?</p>
        <div class="chips" id="chips">
          <button class="chip" data-rounds="3">Quick</button>
          <button class="chip active" data-rounds="5">Balanced</button>
          <button class="chip" data-rounds="8">Thorough</button>
        </div>
        <p id="estimate" class="estimate"></p>
      </div>

      <div class="upload-actions">
        <button id="clear-btn" class="btn ghost" hidden>Clear all</button>
        <button id="start-btn" class="btn primary" disabled>Start ranking</button>
      </div>
      <p id="upload-hint" class="hint">Add at least 2 photos to begin.</p>
    </section>

    <!-- ───────────── Match screen ───────────── -->
    <section id="match" class="screen">
      <div class="match-bar">
        <span id="round-info"></span>
      </div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>

      <div class="arena">
        <div class="card" data-side="0">
          <img alt="Option 1" />
          <div class="pick-hint">Tap to pick · <kbd>1</kbd>/<kbd>←</kbd></div>
        </div>
        <div class="vs">VS</div>
        <div class="card" data-side="1">
          <img alt="Option 2" />
          <div class="pick-hint">Tap to pick · <kbd>2</kbd>/<kbd>→</kbd></div>
        </div>
      </div>

      <div class="match-actions">
        <button id="undo-btn" class="btn ghost" disabled>↶ Undo</button>
        <button id="finish-btn" class="btn primary">Finish &amp; rank →</button>
      </div>
    </section>

    <!-- ───────────── Results screen ───────────── -->
    <section id="results" class="screen">
      <h2>🏆 Final Ranking</h2>
      <p id="results-sub" class="hint"></p>
      <div id="ranking" class="ranking"></div>
      <div class="results-actions">
        <button id="refine-btn" class="btn primary">Refine further</button>
        <button id="rematch-btn" class="btn ghost">Restart (same photos)</button>
        <button id="new-btn" class="btn ghost">New set</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Everything runs locally in your browser — no photos are uploaded anywhere.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
